name: Dharalu monitor

on:
  schedule:
    # Backup only: the Mac checks every 5 minutes (scripts/mac-schedule.sh). These runs
    # do nothing when the Mac published in the last 3 hours (--if-stale 3).
    - cron: "0 7 * * *"    # 12:30 IST
    - cron: "0 14 * * *"   # 19:30 IST
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Re-seed price history first (slow with the sample key)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dharalu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional AI briefing library
        run: pip install --quiet anthropic
      - name: Seed history
        if: ${{ inputs.bootstrap }}
        run: python agent/bootstrap.py
      - name: Save seeded history
        if: ${{ inputs.bootstrap && !cancelled() }}
        run: |
          ./.github/save.sh "data: seed history"
      - name: Fetch, analyse, alert
        # Manual runs always go; scheduled ones skip if the Mac published recently.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python agent/run.py --if-stale 3; else python agent/run.py; fi
      - name: Save data
        # Runs even if the analysis failed, so fetched prices are never thrown away.
        if: ${{ !cancelled() }}
        run: |
          ./.github/save.sh "data: $(date +'%Y-%m-%d %H:%M IST')"
